<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Pro OTC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center shadow-xl">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">Pocket Option OTC Bot</h1>
                <p class="text-slate-400 text-sm mt-1">Multi-Timeframe 3s - 5m Signal & Execution Panel</p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center space-x-3">
                <span id="botStatusBadge" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">ONLINE</span>
                <button onclick="toggleBot()" id="toggleBtn" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-red-600/30">Stop Bot</button>
            </div>
        </div>

        <!-- Main Control Panel -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left: Settings & Analysis -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
                <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">Market Settings</h2>
                
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Select OTC Asset Pair</label>
                    <select id="pairSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                        <!-- Loaded dynamically -->
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Timeframe (Duration)</label>
                    <select id="tfSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                        <option value="3">3 Seconds</option>
                        <option value="5">5 Seconds</option>
                        <option value="15">15 Seconds</option>
                        <option value="30">30 Seconds</option>
                        <option value="60">1 Minute (60s)</option>
                        <option value="120">2 Minutes (120s)</option>
                        <option value="180">3 Minutes (180s)</option>
                        <option value="240" selected>4 Minutes (240s)</option>
                        <option value="300">5 Minutes (300s)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Trade Amount ($)</label>
                    <input type="number" id="tradeAmount" value="10.0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>

                <button onclick="runAnalysis()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-cyan-600/30">Analyze Market Signal</button>
            </div>

            <!-- Right: Signal Output & Actions -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col justify-between space-y-4">
                <div>
                    <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2 mb-4">Signal Result</h2>
                    <div id="signalBox" class="bg-slate-900 border border-slate-700 rounded-xl p-6 text-center space-y-2">
                        <div class="text-xs text-slate-400 uppercase tracking-wider">Generated Signal</div>
                        <div id="signalText" class="text-3xl font-extrabold text-slate-400">WAITING</div>
                        <div id="priceText" class="text-sm text-slate-400">Price: --</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="executeTrade('CALL')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center space-x-2">
                        <span>📈 CALL (HIGHER)</span>
                    </button>
                    <button onclick="executeTrade('PUT')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-rose-600/30 flex items-center justify-center space-x-2">
                        <span>📉 PUT (LOWER)</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Logs / Activity Log -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2 mb-3">Execution Log</h2>
            <div id="logOutput" class="bg-slate-900 border border-slate-700 rounded-xl p-4 h-32 overflow-y-auto text-xs font-mono text-slate-300 space-y-1">
                [System] Dashboard loaded successfully. Ready for OTC operations...
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function loadPairs() {
            try {
                const res = await fetch(`${API_BASE}/pairs`);
                const data = await res.json();
                const select = document.getElementById('pairSelect');
                select.innerHTML = '';
                data.pairs.forEach(pair => {
                    const opt = document.createElement('option');
                    opt.value = pair;
                    opt.textContent = pair;
                    select.appendChild(opt);
                });
            } catch (e) {
                logMessage("Error loading pairs: " + e.message);
            }
        }

        async function toggleBot() {
            const btn = document.getElementById('toggleBtn');
            const isRunning = btn.textContent.includes('Stop');
            const endpoint = isRunning ? '/stop' : '/start';
            try {
                const res = await fetch(`${API_BASE}${endpoint}`, { method: 'POST' });
                const data = await res.json();
                if(isRunning) {
                    btn.textContent = "Start Bot";
                    btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-emerald-600/30";
                    document.getElementById('botStatusBadge').textContent = "OFFLINE";
                    document.getElementById('botStatusBadge').className = "px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30";
                } else {
                    btn.textContent = "Stop Bot";
                    btn.className = "bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-red-600/30";
                    document.getElementById('botStatusBadge').textContent = "ONLINE";
                    document.getElementById('botStatusBadge').className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                }
                logMessage(data.message);
            } catch(e) {
                logMessage("Toggle error: " + e.message);
            }
        }

        async function runAnalysis() {
            const pair = document.getElementById('pairSelect').value;
            const timeframe = parseInt(document.getElementById('tfSelect').value);
            // Dummy mock candle prices for testing
            const prices = [1.0850, 1.0852, 1.0855, 1.0853, 1.0858];

            try {
                const res = await fetch(`${API_BASE}/analyze`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ pair, timeframe, prices })
                });
                const data = await res.json();
                const sigText = document.getElementById('signalText');
                sigText.textContent = data.signal;
                sigText.className = `text-3xl font-extrabold ${data.signal === 'CALL' ? 'text-emerald-400' : 'text-rose-400'}`;
                document.getElementById('priceText').textContent = `Price: ${data.current_price} | SMA: ${data.benchmark_sma.toFixed(4)}`;
                logMessage(`Analyzed ${pair} (${timeframe}s): Signal -> ${data.signal}`);
            } catch(e) {
                logMessage("Analysis error: " + e.message);
            }
        }

        async function executeTrade(action) {
            const pair = document.getElementById('pairSelect').value;
            const duration = parseInt(document.getElementById('tfSelect').value);
            const amount = parseFloat(document.getElementById('tradeAmount').value);

            try {
                const res = await fetch(`${API_BASE}/trade`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ pair, action, amount, duration })
                });
                const data = await res.json();
                if(res.ok) {
                    logMessage(`SUCCESS: Placed ${action} on ${pair} for ${duration}s ($${amount})`);
                } else {
                    logMessage(`ERROR: ${data.detail || 'Trade failed'}`);
                }
            } catch(e) {
                logMessage("Trade execution error: " + e.message);
            }
        }

        function logMessage(msg) {
            const box = document.getElementById('logOutput');
            const time = new Date().toLocaleTimeString();
            box.innerHTML += `<div>[${time}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        loadPairs();
    </script>
</body>
  </html>
